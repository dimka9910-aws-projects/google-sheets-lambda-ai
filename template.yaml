AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI-powered command parser for Telegram finance tracker

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: java17

Parameters:
  OpenAIApiKey:
    Type: String
    Description: OpenAI API Key
    NoEcho: true
  DatabaseUrl:
    Type: String
    Description: Neon PostgreSQL connection string
    NoEcho: true
  SheetsQueueUrl:
    Type: String
    Description: URL of the SQS queue for google-sheets-lambda
    Default: ""
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  DryRun:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Dry run mode - logs instead of sending to SQS

Resources:
  # ═══════════════════════════════════════════════════════════════════════════
  # LAMBDA
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Main Lambda - processes Telegram messages from SQS
  TelegramSQSHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub telegram-sqs-handler-${Environment}
      Handler: com.github.dimka9910.sheets.ai.SQSHandler::handleRequest
      CodeUri: .
      Description: Spring Boot Lambda - processes Telegram requests from SQS, parses with AI, sends responses
      # SnapStart for faster cold starts (Java 17+)
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          OPENAI_API_KEY: !Ref OpenAIApiKey
          DATABASE_URL: !Ref DatabaseUrl
          SHEETS_QUEUE_URL: !Ref SheetsQueueUrl
          DRY_RUN: !Ref DryRun
          RESPONSE_QUEUE_URL: !Ref ResponsesQueue
          # Spring Cloud Function configuration
          SPRING_CLOUD_FUNCTION_DEFINITION: sqsMessageHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: 
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:sheets-queue-*"
                - !GetAtt ResponsesQueue.Arn
            # SQS Event Source Mapping automatically grants:
            # - sqs:ReceiveMessage
            # - sqs:DeleteMessage  
            # - sqs:GetQueueAttributes
            # for RequestsQueue
      Events:
        TelegramRequests:
          Type: SQS
          Properties:
            Queue: !GetAtt RequestsQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0  # Process immediately
            FunctionResponseTypes:
              - ReportBatchItemFailures  # Enable partial batch failure reporting

  # ═══════════════════════════════════════════════════════════════════════════
  # SQS QUEUES
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Queue for incoming requests from Telegram Bot
  RequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub telegram-requests-${Environment}
      VisibilityTimeout: 120  # Must be > Lambda timeout (60 sec)
      MessageRetentionPeriod: 86400  # 24 hours
      ReceiveMessageWaitTimeSeconds: 0  # Short polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RequestsQueueDLQ.Arn
        maxReceiveCount: 3  # After 3 failed attempts, move to DLQ

  # Dead Letter Queue for failed requests
  RequestsQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub telegram-requests-${Environment}-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  # Queue for responses to Telegram Bot
  ResponsesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub telegram-responses-${Environment}
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400  # 24 hours
      ReceiveMessageWaitTimeSeconds: 0  # Short polling

Outputs:
  RequestsQueueUrl:
    Description: URL of SQS queue for incoming Telegram requests
    Value: !Ref RequestsQueue
    
  RequestsQueueArn:
    Description: ARN of SQS queue for incoming Telegram requests  
    Value: !GetAtt RequestsQueue.Arn

  ResponsesQueueUrl:
    Description: URL of SQS queue for responses to Telegram
    Value: !Ref ResponsesQueue
    
  ResponsesQueueArn:
    Description: ARN of SQS queue for responses to Telegram
    Value: !GetAtt ResponsesQueue.Arn

  RequestsQueueDLQUrl:
    Description: URL of Dead Letter Queue for failed requests
    Value: !Ref RequestsQueueDLQ
    
  RequestsQueueDLQArn:
    Description: ARN of Dead Letter Queue for failed requests
    Value: !GetAtt RequestsQueueDLQ.Arn
