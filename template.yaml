AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI-powered command parser for Telegram finance tracker

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: java17

Parameters:
  OpenAIApiKey:
    Type: String
    Description: OpenAI API Key
    NoEcho: true
  SheetsQueueUrl:
    Type: String
    Description: URL of the SQS queue for google-sheets-lambda
    Default: ""
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  DryRun:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Dry run mode - logs instead of sending to SQS

Resources:
  # ═══════════════════════════════════════════════════════════════════════════
  # LAMBDA
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Main Lambda - processes Telegram messages from SQS
  TelegramSQSHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub telegram-sqs-handler-${Environment}
      Handler: com.github.dimka9910.sheets.ai.SQSHandler::handleRequest
      CodeUri: .
      Description: Processes Telegram requests from SQS, parses with AI, sends responses to Response Queue
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          OPENAI_API_KEY: !Ref OpenAIApiKey
          SHEETS_QUEUE_URL: !Ref SheetsQueueUrl
          USERS_TABLE_NAME: !Ref UsersTable
          DRY_RUN: !Ref DryRun
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: 
                - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:sheets-queue-*"
      Events:
        TelegramRequests:
          Type: SQS
          Properties:
            Queue: !GetAtt RequestsQueue.Arn
            BatchSize: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # DYNAMODB
  # ═══════════════════════════════════════════════════════════════════════════
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub finance-tracker-users-${Environment}
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: telegramId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: telegramId-index
          KeySchema:
            - AttributeName: telegramId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: finance-tracker

  # ═══════════════════════════════════════════════════════════════════════════
  # SQS QUEUES
  # ═══════════════════════════════════════════════════════════════════════════
  
  # Queue for incoming requests from Telegram Bot
  RequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub telegram-requests-${Environment}
      VisibilityTimeout: 120  # Must be > Lambda timeout (60 sec)

Outputs:
  UsersTableName:
    Description: DynamoDB table for user contexts
    Value: !Ref UsersTable
  
  UsersTableArn:
    Description: ARN of DynamoDB table
    Value: !GetAtt UsersTable.Arn
  
  RequestsQueueUrl:
    Description: URL of SQS queue for incoming Telegram requests
    Value: !Ref RequestsQueue
    
  RequestsQueueArn:
    Description: ARN of SQS queue for incoming Telegram requests  
    Value: !GetAtt RequestsQueue.Arn
