name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: eu-central-1
  MAVEN_SETTINGS: .github/maven-settings.xml
  SAM_CLI_TELEMETRY: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Configure Maven mirror (for SAM build)
        run: |
          mkdir -p "$HOME/.m2"
          cp "$MAVEN_SETTINGS" "$HOME/.m2/settings.xml"
      
      - name: Build with Maven (Spring Boot)
        run: mvn -s "$MAVEN_SETTINGS" -B -ntp clean package -DskipTests
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: target/*.jar
          retention-days: 1

  deploy-dev:
    name: Deploy to DEV
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Configure Maven mirror (for SAM build)
        run: |
          mkdir -p "$HOME/.m2"
          cp "$MAVEN_SETTINGS" "$HOME/.m2/settings.xml"
      
      - name: Build with Maven (Spring Boot)
        run: mvn -s "$MAVEN_SETTINGS" -B -ntp clean package -DskipTests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          MAVEN_SETTINGS: ${{ env.MAVEN_SETTINGS }}
        run: |
          echo "🚀 Running database migrations to DEV..."
          chmod +x ./run-migrations.sh
          ./run-migrations.sh
      
      - name: SAM Build
        run: sam build

      - name: Wait for CloudFormation stack to be idle (DEV)
        run: |
          STACK="google-sheets-ai-parser-dev"
          REGION="${{ env.AWS_REGION }}"
          echo "Checking stack status: $STACK ($REGION)"
          if aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" >/dev/null 2>&1; then
            # Wait until stack is not *_IN_PROGRESS (queue multiple deploys safely)
            deadline=$(( $(date +%s) + 1800 )) # 30 minutes
            while true; do
              status="$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query 'Stacks[0].StackStatus' --output text)"
              echo "StackStatus=$status"
              case "$status" in
                *_IN_PROGRESS)
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "Timed out waiting for $STACK to become idle (last status: $status)"
                    exit 1
                  fi
                  sleep 15
                  ;;
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED|UPDATE_FAILED)
                  echo "Stack is in a failed state: $status. Manual intervention required."
                  exit 1
                  ;;
                *)
                  echo "Stack is idle: $status"
                  break
                  ;;
              esac
            done
          else
            echo "Stack does not exist yet; continuing."
          fi
      
      - name: SAM Deploy to DEV
        run: |
          PARAMS="Environment=dev OpenAIApiKey=${{ secrets.OPENAI_API_KEY }} DatabaseUrl=${{ secrets.DATABASE_URL_DEV }} DryRun=false"
          if [ -n "${{ secrets.SHEETS_QUEUE_URL_DEV }}" ]; then
            PARAMS="$PARAMS SheetsQueueUrl=${{ secrets.SHEETS_QUEUE_URL_DEV }}"
          fi
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            PARAMS="$PARAMS TelegramBotToken=${{ secrets.TELEGRAM_BOT_TOKEN }}"
          fi
          sam deploy \
            --stack-name google-sheets-ai-parser-dev \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides $PARAMS
      
      - name: Output API Endpoint
        run: |
          echo "## 🚀 DEV Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          aws cloudformation describe-stacks \
            --stack-name google-sheets-ai-parser-dev \
            --query 'Stacks[0].Outputs' \
            --output table >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to PROD
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Configure Maven mirror (for SAM build)
        run: |
          mkdir -p "$HOME/.m2"
          cp "$MAVEN_SETTINGS" "$HOME/.m2/settings.xml"
      
      - name: Build with Maven (Spring Boot)
        run: mvn -s "$MAVEN_SETTINGS" -B -ntp clean package -DskipTests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          MAVEN_SETTINGS: ${{ env.MAVEN_SETTINGS }}
        run: |
          echo "🚀 Running database migrations to PROD..."
          chmod +x ./run-migrations.sh
          ./run-migrations.sh
      
      - name: SAM Build
        run: sam build

      - name: Wait for CloudFormation stack to be idle (PROD)
        run: |
          STACK="google-sheets-ai-parser-prod"
          REGION="${{ env.AWS_REGION }}"
          echo "Checking stack status: $STACK ($REGION)"
          if aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" >/dev/null 2>&1; then
            deadline=$(( $(date +%s) + 1800 )) # 30 minutes
            while true; do
              status="$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query 'Stacks[0].StackStatus' --output text)"
              echo "StackStatus=$status"
              case "$status" in
                *_IN_PROGRESS)
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "Timed out waiting for $STACK to become idle (last status: $status)"
                    exit 1
                  fi
                  sleep 15
                  ;;
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED|UPDATE_FAILED)
                  echo "Stack is in a failed state: $status. Manual intervention required."
                  exit 1
                  ;;
                *)
                  echo "Stack is idle: $status"
                  break
                  ;;
              esac
            done
          else
            echo "Stack does not exist yet; continuing."
          fi
      
      - name: SAM Deploy to PROD
        run: |
          PARAMS="Environment=prod OpenAIApiKey=${{ secrets.OPENAI_API_KEY }} DatabaseUrl=${{ secrets.DATABASE_URL_PROD }} DryRun=false"
          if [ -n "${{ secrets.SHEETS_QUEUE_URL_PROD }}" ]; then
            PARAMS="$PARAMS SheetsQueueUrl=${{ secrets.SHEETS_QUEUE_URL_PROD }}"
          fi
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN_PROD }}" ]; then
            PARAMS="$PARAMS TelegramBotToken=${{ secrets.TELEGRAM_BOT_TOKEN_PROD }}"
          fi
          sam deploy \
            --stack-name google-sheets-ai-parser-prod \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides $PARAMS
      
      - name: Output API Endpoint
        run: |
          echo "## 🚀 PROD Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          aws cloudformation describe-stacks \
            --stack-name google-sheets-ai-parser-prod \
            --query 'Stacks[0].Outputs' \
            --output table >> $GITHUB_STEP_SUMMARY
