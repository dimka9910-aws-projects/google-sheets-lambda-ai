spring:
  application:
    name: finance-tracker-ai
  
  # Cloud Function configuration
  cloud:
    function:
      definition: sqsMessageHandler
  
  # JPA configuration for PostgreSQL
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Liquibase handles schema, Hibernate only validates
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
    open-in-view: false  # Disable OSIV for Lambda (no HTTP session)
  
  # DataSource configuration (overridden by DataSourceConfig if DATABASE_URL env var exists)
  # Note: DataSourceConfig converts DATABASE_URL from postgresql:// to jdbc:postgresql:// format
  datasource:
    url: ${DATABASE_URL:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ⚠️ CRITICAL: SnapStart-optimized connection pool settings
      # Lambda processes 1 request at a time, needs only 1 connection
      maximum-pool-size: 1  # 1 connection max (Lambda is single-threaded per instance)
      minimum-idle: 0       # No idle connections (close all before snapshot)
      connection-timeout: 10000  # 10s timeout for new connection
      max-lifetime: 540000  # 9 minutes (less than Lambda 10min timeout, forces reconnect)
      keepalive-time: 0     # Disable keepalive (rely on max-lifetime)
      idle-timeout: 30000   # 30s idle = close connection
      leak-detection-threshold: 60000  # Detect leaks after 60s
  
  # Liquibase configuration
  liquibase:
    enabled: false  # Migrations run separately in CI/CD, not at Lambda startup
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  # Spring AI configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com  # Can override for testing
      chat:
        enabled: true
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 2000
      # Retry configuration for resilience
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

# Logging configuration
logging:
  level:
    root: INFO
    com.github.dimka9910.sheets.ai: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    liquibase: INFO
